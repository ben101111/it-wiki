name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt
      - name: MkDocs (strict)
        run: mkdocs build --strict
      - name: Shell-Syntax
        run: bash -n scripts/cms-install.sh
      - name: Decap-Konfiguration ist gültiges YAML
        run: python -c "import yaml; yaml.safe_load(open('admin/config.yml'))"
