  label: 'Einstellungen: Kategorien'
  label_singular: Kategorie
  description: Kategorien für alle Beiträge. Anleitungen und eigene Inhaltstypen werden in der Navigation danach gruppiert. Änderungen erscheinen nach dem nächsten Build.
  folder: cms/kategorien
  extension: yml
  format: yml
  create: true
  delete: true
  slug: '{{fields.dateiname}}'
  summary: '{{title}}'
  sortable_fields:
  - title
  - reihenfolge
  fields:
  - label: Dateiname
    name: dateiname
    widget: hidden
    default: ''
    required: false
  - label: Name
    name: title
    widget: string
    hint: So erscheint die Kategorie in Auswahllisten und in der Navigation.
  - label: Beschreibung
    name: beschreibung
    widget: text
    required: false
  - label: Reihenfolge
    name: reihenfolge
    widget: number
    value_type: int
    default: 100
    required: false
    hint: Kleinere Zahl = weiter oben in der Navigation
- name: inhaltstyp
  label: 'Einstellungen: Inhaltstypen'
  label_singular: Inhaltstyp
  description: Eigene Inhaltstypen. Jeder Typ erhält einen eigenen Bereich in der Navigation, sobald es den ersten Beitrag gibt. Beiträge legen Sie unter „Weitere Inhaltstypen“ an.
  folder: cms/inhaltstypen
  extension: yml
  format: yml
  create: true
  delete: true
  slug: '{{fields.dateiname}}'
  summary: '{{title}} – Navigation: {{mehrzahl}}'
  fields:
  - label: Dateiname
    name: dateiname
    widget: hidden
    default: ''
    required: false
  - label: Name (Einzahl)
    name: title
    widget: string
    hint: z. B. „Checkliste“
  - label: Name in der Navigation (Mehrzahl)
    name: mehrzahl
    widget: string
    hint: z. B. „Checklisten“
  - label: Beschreibung
    name: beschreibung
    widget: text
    required: false
    hint: Erscheint oben auf der Übersichtsseite des Bereichs.
  - label: Position in der Navigation
    name: position
    widget: select
    options:
    - Nach den Anleitungen
    - Am Ende
    default: Nach den Anleitungen
  - label: Reihenfolge
    name: reihenfolge
    widget: number
    value_type: int
    default: 100
    required: false
    hint: 'Bei mehreren Inhaltstypen: kleinere Zahl = weiter oben'
