# Decap CMS – Konfiguration der Redaktionsoberfläche (/admin/)
#
# Platzhalter __WIKI_URL__, __GITEA_URL__, __GITEA_REPO__ und __OAUTH_CLIENT_ID__
# werden beim Veröffentlichen vom Deploy-Dienst aus /opt/it-wiki/.env ersetzt.
# Hier stehen bewusst keine Geheimnisse: Die Anmeldung läuft über OAuth mit PKCE,
# es gibt kein Client-Secret.

# Diese Datei ist vollständig ausgeschrieben (ohne YAML-Anker), damit Decap CMS sie sicher liest.

backend:
  name: gitea
  repo: __GITEA_REPO__
  branch: main
  app_id: __OAUTH_CLIENT_ID__
  base_url: __GITEA_URL__
  api_root: __GITEA_URL__/api/v1
  commit_messages:
    create: 'Neu ({{collection}}): {{slug}} – {{author-login}}'
    update: 'Geändert ({{collection}}): {{slug}} – {{author-login}}'
    delete: 'Gelöscht ({{collection}}): {{slug}} – {{author-login}}'
    uploadMedia: 'Bild hochgeladen: {{path}} – {{author-login}}'
    deleteMedia: 'Bild gelöscht: {{path}} – {{author-login}}'
locale: de
site_url: __WIKI_URL__
display_url: __WIKI_URL__
logo_url: __WIKI_URL__/assets/favicon.svg
media_folder: docs/assets/images/uploads
public_folder: ../assets/images/uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: anleitung
  label: Anleitungen
  label_singular: Anleitung
  description: Schritt-für-Schritt-Anleitungen (Installation, Konfiguration). Gespeichert unter docs/anleitungen/.
  folder: docs/anleitungen
  extension: md
  format: frontmatter
  create: true
  delete: false
  slug: '{{fields.dateiname}}'
  filter:
    field: vorlage
    value: anleitung
  summary: '{{title}}'
  sortable_fields:
  - title
  - zuletzt_geprueft
  preview_path: anleitungen/{{slug}}/
  fields:
  - label: Vorlage
    name: vorlage
    widget: hidden
    default: anleitung
  - label: Dateiname
    name: dateiname
    widget: hidden
    default: ''
    required: false
  - label: Titel
    name: title
    widget: string
    hint: Kurz und eindeutig, z. B. „DNS-Forwarder einrichten“. Daraus entsteht der Dateiname.
  - label: Kategorie
    name: kategorie
    widget: relation
    collection: kategorie
    search_fields:
    - title
    value_field: title
    display_fields:
    - title
    options_length: 200
    required: true
    hint: 'Fehlt eine Kategorie? Unter „Einstellungen: Kategorien“ neu anlegen.'
  - label: Kurzbeschreibung
    name: beschreibung
    widget: text
    required: false
    hint: '1–2 Sätze: Was erreicht man mit dieser Anleitung?'
  - widget: markdown
    modes:
    - rich_text
    buttons:
    - bold
    - italic
    - code
    - link
    - heading-three
    - quote
    - bulleted-list
    - numbered-list
    editor_components:
    - image
    - code-block
    required: false
    label: Voraussetzungen
    name: voraussetzungen
  - widget: markdown
    modes:
    - rich_text
    buttons:
    - bold
    - italic
    - code
    - link
    - heading-three
    - quote
    - bulleted-list
    - numbered-list
    editor_components:
    - image
    - code-block
    required: true
    label: Anleitung
    name: body
    hint: Die eigentlichen Schritte. Befehle über „Codeblock“ einfügen.
  - label: Screenshots/Bilder
    name: bilder
    widget: list
    required: false
    collapsed: false
    label_singular: Bild
    summary: '{{fields.beschriftung}}'
    hint: Bilder werden unter docs/assets/images/uploads/ gespeichert. Zugangsdaten, E-Mail-Adressen und Namen vorher schwärzen.
    fields:
    - label: Bild
      name: bild
      widget: image
      choose_url: false
    - label: Bildunterschrift
      name: beschriftung
      widget: string
      required: false
  - widget: markdown
    modes:
    - rich_text
    buttons:
    - bold
    - italic
    - code
    - link
    - heading-three
    - quote
    - bulleted-list
    - numbered-list
    editor_components:
    - image
    - code-block
    required: false
    label: Prüfung/Erfolgskontrolle
    name: pruefung
  - widget: markdown
    modes:
    - rich_text
    buttons:
    - bold
    - italic
    - code
    - link
    - heading-three
    - quote
    - bulleted-list
    - numbered-list
    editor_components:
    - image
    - code-block
    required: false
    label: Troubleshooting
    name: troubleshooting
  - label: Verwandte Anleitungen
    name: verwandte_anleitungen
    widget: relation
    collection: anleitung
    search_fields:
    - title
    value_field: '{{slug}}'
    display_fields:
    - title
    multiple: true
    required: false
  - label: Verwandte Troubleshooting-Artikel
    name: verwandte_troubleshooting
    widget: relation
    collection: troubleshooting
    search_fields:
    - title
    value_field: '{{slug}}'
    display_fields:
    - title
    multiple: true
    required: false
  - label: Weitere Links
    name: weitere_links
    widget: list
    required: false
    fields:
    - label: Linktext
      name: text
      widget: string
    - label: Adresse (https://…)
      name: url
      widget: string
      pattern:
      - ^https?://
      - Bitte eine vollständige Adresse mit http:// oder https:// angeben
  - label: Verantwortlich
    name: verantwortlich
    widget: string
    required: false
    hint: Rolle oder Team, z. B. „IT-Team Server“. Leer lassen = eigener Name.
  - label: Zuletzt geprüft
    name: zuletzt_geprueft
    widget: datetime
    format: YYYY-MM-DD
    date_format: DD.MM.YYYY
    time_format: false
    picker_utc: true
    required: false
  - label: Tags
    name: tags
    widget: list
    required: false
    allow_add: true
    hint: Schlagwörter, mit Komma trennen, z. B. DNS, Active Directory
  - label: Archiviert
    name: archiviert
    widget: boolean
    default: false
    required: false
    hint: Archivierte Beiträge bleiben lesbar, werden aber deutlich als veraltet gekennzeichnet.
